<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f8fafc;color:#1e293b;padding-bottom:2rem}
header{background:#4f46e5;color:#fff;padding:1.25rem 1rem .9rem;border-radius:0 0 1.5rem 1.5rem}
header h1{font-size:1.25rem}
header .sub{color:#c7d2fe;font-size:.8rem}
.hd{max-width:640px;margin:0 auto;overflow:hidden}
.j{float:right;text-align:right}
.j b{font-size:1.5rem}
.j span{display:block;color:#c7d2fe;font-size:.7rem}
.bar{max-width:640px;margin:.7rem auto 0;font-size:.75rem;color:#e0e7ff;display:flex;justify-content:space-between}
.track{height:10px;background:rgba(255,255,255,.25);border-radius:99px;overflow:hidden;margin-top:4px}
.fill{height:100%;background:#34d399;border-radius:99px;transition:width .4s}
nav{max-width:640px;margin:1rem auto 0;padding:0 1rem;display:flex;gap:.4rem;flex-wrap:wrap}
nav button{border:1px solid #e2e8f0;background:#fff;color:#475569;padding:.4rem .85rem;border-radius:99px;font-size:.85rem;cursor:pointer}
nav button.on{background:#4f46e5;color:#fff;border-color:#4f46e5}
main{max-width:640px;margin:0 auto;padding:1rem;display:grid;gap:.7rem}
.card{background:#fff;border:1px solid #f1f5f9;border-radius:1rem;padding:1rem;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card h3{font-size:.95rem;margin-bottom:.6rem;display:flex;justify-content:space-between;align-items:center;gap:.5rem;flex-wrap:wrap}
.hint{font-size:.75rem;color:#64748b;padding:0 .25rem}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th{font-size:.65rem;text-transform:uppercase;color:#94a3b8;text-align:left;padding:.3rem 0}
td{border-top:1px solid #f1f5f9;padding:.45rem 0;vertical-align:middle}
select,input{font-size:.85rem;border:1px solid #e2e8f0;background:#f8fafc;border-radius:.5rem;padding:.4rem .5rem;font-family:inherit;max-width:130px}
input[type=checkbox]{max-width:none}
input[type=url],input[type=password],input[type=date],input[type=number]{max-width:220px}
.chip{display:inline-block;font-size:.7rem;font-weight:600;padding:.15rem .5rem;border-radius:99px;white-space:nowrap}
.chip.f{background:#d1fae5;color:#047857}.chip.p{background:#e0e7ff;color:#4338ca}
.add{width:100%;padding:.65rem;border:2px dashed #a5b4fc;background:none;color:#4f46e5;border-radius:.75rem;font-size:.85rem;cursor:pointer;font-weight:600}
.btn{background:#4f46e5;color:#fff;border:none;padding:.35rem .7rem;border-radius:.5rem;font-size:.75rem;cursor:pointer}
.del{background:none;border:none;color:#cbd5e1;cursor:pointer;font-size:.85rem}
.del:hover{color:#ef4444}
.warn{background:#fffbeb;border-color:#fde68a}
.warn h3{color:#b45309;font-size:.85rem}
.warn li{font-size:.75rem;color:#475569;margin:.25rem 0 .25rem 1rem}
.alert{background:#fef2f2;border-color:#fecaca}
.alert h3{color:#b91c1c;font-size:.85rem}
.alert .task{font-size:.8rem;color:#475569}
.kv{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.5rem;text-align:center}
.kv b{font-size:1.1rem;display:block}
label{display:block;font-size:.85rem;font-weight:600;margin:.8rem 0 .2rem}
.small{font-size:.7rem;color:#94a3b8;margin-top:.75rem}
.sync{font-size:.75rem;padding:.3rem .6rem;border-radius:.5rem;cursor:pointer;border:1px solid #e2e8f0;background:#fff;color:#475569}
.sync.ok{background:#d1fae5;color:#047857;border-color:#a7f3d0}
.offer{cursor:pointer}
.offer .chev{color:#94a3b8;font-size:.8rem;transition:transform .2s}
.offer.open .chev{transform:rotate(90deg)}
.detail{display:none;margin-top:.7rem;border-top:1px dashed #e2e8f0;padding-top:.7rem}
.offer.open .detail{display:block}
.detail h4{font-size:.7rem;text-transform:uppercase;letter-spacing:.03em;margin:.6rem 0 .25rem}
.detail h4.elig{color:#4338ca}.detail h4.prime{color:#047857}.detail h4.fees{color:#b45309}.detail h4.close{color:#be123c}
.detail li{font-size:.75rem;color:#475569;margin:.2rem 0 .2rem 1rem}
.updated{font-size:.65rem;color:#94a3b8}
.bold{font-weight:700;color:#334155}
.acct{border:1px solid #eef2ff;border-radius:.75rem;padding:.7rem;margin-top:.6rem;background:#fafaff}
.acct h4{font-size:.85rem;display:flex;justify-content:space-between;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:.3rem}
.task{display:flex;align-items:flex-start;gap:.55rem;padding:.28rem 0;cursor:pointer;font-size:.82rem}
.task input{margin-top:.1rem;accent-color:#4f46e5}
.task .due{font-size:.7rem}
.late{color:#b91c1c;font-weight:600}
.soon{color:#b45309}
.done{color:#94a3b8;text-decoration:line-through}
.newacct{display:flex;gap:.4rem;margin-top:.6rem;flex-wrap:wrap;align-items:center}
.newacct select,.newacct input{max-width:none;flex:1;min-width:110px}
</style>

<body>
<header>
  <div class="hd">
    <div class="j" id="countdown"></div>
    <h1>🏀 WEP Primes</h1>
    <div class="sub">Financer le week-end avec les primes de parrainage</div>
  </div>
  <div class="bar">
    <span id="barL"></span><span id="barR"></span>
  </div>
  <div class="track"><div class="fill" id="fill"></div></div>
</header>
<nav id="tabs"></nav>
<main id="main"></main>
<script>
/* ====== WEP Primes PWA — assistant d'accompagnement daté ======
   Intégration future dans la PWA WEP :
   - WepPrimes.mount(el)         rend l'app dans un élément de votre PWA
   - WepPrimes.get()/set(k,v)   accède à l'état (members, wepDate, …)
   - module.exports = WepPrimes si bundlé
   Modèle : membres → affiliations (banque + date d'ouverture) → tâches
   générées automatiquement depuis les conditions de chaque banque, avec
   échéances calculées. Alerte tant que la tâche n'est pas cochée.
   Synchronisation groupe : régler "URL de sync" dans Réglages. */

const OFFERS_UPDATED = "17 novembre 2026";

const BANKS = [
  {name:"BoursoBank",f:220,p:150,updated:"17/11/2026",
   cfg:{depositDays:30,depositLabel:"Premier versement ≥ 300 €",payMonths:3,payLabel:"1 paiement carte ce mois-ci",moveDays:30,moveLabel:"Bonus EasyMove : activer + 1 transfert",primeDays:100,closeDays:100},
   eligibility:["Nouveau client uniquement : jamais eu de compte BoursoBank/Boursorama, même ancien","Majeur, résident en France, RIB français ou UE","Compte à titre personnel uniquement"],
   prime:["Code parrain obligatoire à l'inscription : IMPOSSIBLE à ajouter après validation du dossier","Premier versement d'au moins 300 € pendant l'inscription ou dans les 30 jours","Utiliser la carte au moins 1 fois par mois pendant 3 mois : chaque mois débloque une tranche de prime","Bonus EasyMove (+50 €) : activer la mobilité bancaire et effectuer 1 transfert, dans le mois suivant l'ouverture"],
   fees:["Carte gratuite seulement si ≥ 1 paiement par mois, sinon frais d'inactivité (~5 €/mois)","Retraits hors zone euro payants après le 1er par mois","Astuce : programmer un prélèvement automatique (ex. abonnement) dès l'ouverture"],
   close:["Ne pas fermer avant les 3 mois d'utilisation : les tranches restantes seraient perdues","Une prime déjà versée peut être reprise si fermeture trop précoce","Remettre le solde à zéro avant de demander la clôture"]},
  {name:"Hello bank!",f:300,p:120,updated:"17/11/2026",
   cfg:{depositDays:15,depositLabel:"Versement initial (montant selon l'offre)",payMonths:3,payLabel:"Paiements/virements du palier en cours",primeDays:60,closeDays:90},
   eligibility:["Nouveau client uniquement : jamais eu de compte Hello bank!","L'ouverture passe par l'invitation d'un proche déjà client","Majeur, résident en France"],
   prime:["Prime dégressive par paliers d'usage (versement initial, virements réguliers, paiements carte) : lire le détail de l'offre en cours","Prime versée dans un délai d'environ 20 jours après ouverture","Vérifier si l'offre exige un virement régulier type salaire"],
   fees:["Compte gratuit sous conditions d'usage : vérifier le nombre de paiements minimum","Certains services annexes payants : ne rien activer en option"],
   close:["Ne pas fermer avant réception complète de la prime et fin des paliers","Clôture gratuite à demander depuis l'app ou par écrit","Solde à zéro avant clôture"]},
  {name:"Fortuneo",f:130,p:110,updated:"17/11/2026",
   cfg:{depositDays:30,depositLabel:"Premier virement (montant selon l'offre)",payMonths:2,payLabel:"Paiements carte du mois",primeDays:60,closeDays:90},
   eligibility:["Nouveau client uniquement : jamais eu de compte Fortuneo","Majeur, résident en France","Conditions de revenus selon la carte choisie"],
   prime:["Utiliser le lien de parrainage à l'ouverture","Premier virement à effectuer pour débloquer la prime","Prime versée après validation, sous plusieurs semaines"],
   fees:["Carte gratuite sous condition d'utilisation mensuelle : vérifier le seuil exact","Sinon frais de tenue de compte : programmer un paiement automatique"],
   close:["Attendre la fin de la période de condition de la prime avant toute clôture","Solde à zéro, clôture par message sécurisé depuis l'espace client"]},
  {name:"Monabanq",f:130,p:50,updated:"17/11/2026",
   cfg:{depositDays:30,depositLabel:"Premier virement (montant selon l'offre)",payMonths:2,payLabel:"Paiements carte du mois",primeDays:60,closeDays:90},
   eligibility:["Nouveau client uniquement","Majeur, résident en France","Sans condition de revenus"],
   prime:["Lien de parrainage à l'ouverture","Premier virement à effectuer (montant selon l'offre en cours)","Prime versée après quelques semaines"],
   fees:["Carte Standard payante (~3 €/mois) sauf usage suffisant : vérifier les seuils","Frais d'inactivité possibles : garder un paiement mensuel"],
   close:["Ne pas fermer avant réception de la prime","Solde à zéro, clôture depuis l'app ou par courrier"]},
  {name:"Trade Republic",f:0,p:200,updated:"17/11/2026",
   cfg:{depositDays:30,depositLabel:"Dépôt initial + ordre à exécuter (lire l'offre)",payMonths:0,primeDays:60,closeDays:90},
   eligibility:["Nouveau client uniquement","Attention : c'est un compte-titres (courtier), pas un compte courant","Fiscalité des plus-values à déclarer si investissement"],
   prime:["L'offre type : dépôt initial + exécution d'ordres dans un délai donné (lire l'offre exacte)","Prime créditée en titres ou espèces selon les campagnes"],
   fees:["Aucun frais de base mais risque de marché si l'argent reste investi","Retirer les sommes avant clôture : vente + virement vers la banque"],
   close:["Clôture possible après retrait complet des titres et espèces","Penser à l'imposition des éventuelles plus-values"]},
];
const KEY = "wep-primes-v3";
const defaultState = () => ({members:[
  {id:"m1",name:"Jean-Baptiste",accounts:[
    {id:"a1",bank:"BoursoBank",openDate:"2026-11-10",done:{deposit:true,pay1:true},feesLast:"2026-11-10"},
  ]},
  {id:"m2",name:"WEPien 2",accounts:[
    {id:"a2",bank:"Hello bank!",openDate:"2026-11-06",done:{},feesLast:""},
  ]},
  {id:"m3",name:"WEPien 3",accounts:[]},
],wepDate:"",costPerHead:200,mode:"cagnotte",syncUrl:"",syncKey:"",lastSync:null,selBank:""});

let state, tab="suivi";
try{
  const raw = JSON.parse(localStorage.getItem(KEY));
  state = raw && raw.members ? raw : defaultState();
}catch(e){ state = defaultState(); }
const bankOf = n => BANKS.find(b=>b.name===n);
const save = () => { try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){} };

/* ===== Tâches générées par affiliation ===== */
const DAY = 864e5;
function addDays(dstr,n){ if(!dstr) return ""; const d=new Date(dstr); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function today(){ return new Date().toISOString().slice(0,10); }
function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/DAY); }
function fmt(dstr){ if(!dstr) return "date ?"; const d=new Date(dstr); return d.toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit",year:"numeric"}); }

function accountTasks(m,a){
  const b = bankOf(a.bank); if(!b) return [];
  const c = b.cfg, t = [];
  if(c.depositDays) t.push({id:"deposit",label:c.depositLabel,due:addDays(a.openDate,c.depositDays),done:!!a.done.deposit});
  if(c.moveDays)    t.push({id:"move",label:c.moveLabel,due:addDays(a.openDate,c.moveDays),done:!!a.done.move});
  for(let i=1;i<=(c.payMonths||0);i++){
    t.push({id:"pay"+i,label:c.payLabel+" ("+i+"/"+c.payMonths+")",due:addDays(a.openDate,30*i),done:!!a.done["pay"+i]});
  }
  t.push({id:"fees",label:"Vérifier aucun frais ce mois (1 paiement = carte gratuite)",due:a.feesLast?addDays(a.feesLast,30):(a.openDate?addDays(a.openDate,30):""),done:!!a.feesLast && daysBetween(addDays(a.feesLast,30),today())>7,recurring:true});
  t.push({id:"prime",label:"Prime reçue ✅ ("+b.f+" €)",due:addDays(a.openDate,c.primeDays),done:!!a.done.prime});
  if(state.mode==="cagnotte") t.push({id:"pot",label:"Participation versée à la cagnotte",due:addDays(a.openDate,c.primeDays+7),done:!!a.done.pot});
  t.push({id:"zero",label:"Solde remis à zéro (avant clôture)",due:addDays(a.openDate,c.closeDays),done:!!a.done.zero});
  t.push({id:"closed",label:"Compte clôturé sans frais (après la période imposée)",due:addDays(a.openDate,c.closeDays+10),done:!!a.done.closed});
  return t;
}
function allTasks(){
  const out=[];
  state.members.forEach(m=>m.accounts.forEach(a=>{
    accountTasks(m,a).forEach(t=>out.push({m,a,t}));
  }));
  return out;
}
function taskStatus(t){
  if(t.done) return "ok";
  if(!t.due) return "todo";
  const d = daysBetween(today(), t.due);
  if(d<0) return "late";
  if(d<=7) return "soon";
  return "todo";
}
function toggleTask(mid,aid,tid){
  state.members.forEach(m=>{ if(m.id!==mid) return;
    m.accounts.forEach(a=>{ if(a.id!==aid) return;
      if(tid==="fees"){ a.feesLast = today(); }
      else a.done = {...a.done,[tid]:!a.done[tid]};
    });
  });
  save(); render();
}
function addAccount(mid,bank,openDate){
  if(!bank||!openDate) return alert("Choisis une banque et une date d'ouverture.");
  state.members.forEach(m=>{ if(m.id===mid) m.accounts.push({id:"a"+Date.now(),bank,openDate,done:{},feesLast:""}); });
  save(); render();
}
function removeAccount(mid,aid){
  state.members.forEach(m=>{ if(m.id===mid) m.accounts=m.accounts.filter(a=>a.id!==aid); });
  save(); render();
}
function addMember(){
  const name=prompt("Prénom du WEPien ?"); if(!name) return;
  state.members.push({id:"m"+Date.now(),name,accounts:[]});
  save(); render();
}
function removeMember(id){ state.members=state.members.filter(m=>m.id!==id); save(); render(); }

async function pushSync(){
  if(!state.syncUrl) return alert("Renseigne d'abord l'URL de sync dans Réglages.");
  const opt={method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(state)};
  if(state.syncKey){ opt.headers.apikey=state.syncKey; opt.headers.Authorization="Bearer "+state.syncKey; }
  try{
    await fetch(state.syncUrl,opt);
    state.lastSync=new Date().toISOString(); save(); render();
  }catch(e){ alert("Sync impossible : "+e.message); }
}
async function pullSync(){
  if(!state.syncUrl) return alert("Renseigne d'abord l'URL de sync dans Réglages.");
  const opt={headers:{}};
  if(state.syncKey){ opt.headers.apikey=state.syncKey; opt.headers.Authorization="Bearer "+state.syncKey; }
  try{
    const r=await fetch(state.syncUrl,opt); const d=await r.json();
    const next=d.members?d:(d.value||d.data||{});
    if(next.members){ state=Object.assign(defaultState(),next); state.lastSync=new Date().toISOString(); save(); render(); }
    else alert("Réponse inattendue du serveur.");
  }catch(e){ alert("Sync impossible : "+e.message); }
}

function esc(s){ return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function ul(arr){ return "<ul>"+arr.map(x=>"<li>"+esc(x)+"</li>").join("")+"</ul>"; }

function render(){
  const tasks = allTasks();
  const primes = tasks.filter(x=>x.t.id==="prime"&&x.t.done).reduce((s,x)=>s+bankOf(x.a.bank).f,0);
  const kycCount = state.members.reduce((s,m)=>s+m.accounts.length,0);
  const attendues = state.members.reduce((s,m)=>s+m.accounts.reduce((s2,a)=>{const b=bankOf(a.bank);return b?s2+b.f+b.p:s2;},0),0);
  const target = state.members.length*state.costPerHead;
  const pct = target?Math.min(100,Math.round(primes/target*100)):0;
  document.getElementById("barL").textContent="Primes reçues : "+primes+" €";
  document.getElementById("barR").textContent="Objectif : "+target+" € ("+state.members.length+" × "+state.costPerHead+" €)";
  document.getElementById("fill").style.width=pct+"%";
  const cd=document.getElementById("countdown");
  if(state.wepDate){ const d=Math.ceil((new Date(state.wepDate)-Date.now())/DAY);
    cd.innerHTML=d>0?"<b>J-"+d+"</b><span>avant le WEP</span>":"<b>C'est le WEP !</b><span>🎉</span>";
  } else cd.innerHTML="";

  const tabs=[["suivi","Mes démarches"],["groupe","Le groupe"],["banques","Les offres"],["reglages","Réglages"]];
  const alerts = tasks.filter(x=>["late","soon"].includes(taskStatus(x.t)));
  document.getElementById("tabs").innerHTML=tabs.map(([id,l])=>
    "<button class='"+(tab===id?"on":"")+"' onclick='WepPrimes.setTab(\""+id+"\")'>"+l+(id==="suivi"&&alerts.length?" ⏰ "+alerts.length:"")+"</button>").join("");

  const M=document.getElementById("main"); let h="";
  if(tab==="suivi"){
    if(alerts.length){
      h+="<div class='card alert'><h3>⏰ Alertes ("+alerts.length+") — coche quand c'est fait pour la faire disparaître</h3>";
      alerts.sort((x,y)=>x.t.due<y.t.due?-1:1).forEach(x=>{
        const st=taskStatus(x.t);
        h+="<label class='task'><input type='checkbox' onchange='WepPrimes.task(\""+x.m.id+"\",\""+x.a.id+"\",\""+x.t.id+"\")'>"
          +"<span><b>"+esc(x.m.name)+" · "+esc(x.a.bank)+"</b> : "+esc(x.t.label)
          +" <span class='due "+st+"'>("+(st==="late"?"EN RETARD depuis le ":"prévu avant le ")+fmt(x.t.due)+")</span></span></label>";
      });
      h+="</div>";
    }
    h+="<div class='card warn'><h3>🛡️ Garde-fous : zéro frais, zéro compte oublié</h3><ul>"
      +"<li><b>Programme un paiement automatique dès l'ouverture</b> : la plupart des cartes sont gratuites seulement si tu paies au moins 1 fois par mois, sinon frais d'inactivité.</li>"
      +"<li><b>Ne ferme jamais avant la fin de la période imposée</b> : la fiche de chaque offre (onglet Les offres) indique la durée.</li>"
      +"<li><b>Retire tout avant de clôturer</b> : solde à zéro, clôture écrite, vérifie qu'elle est effective.</li></ul></div>";
    state.members.forEach(m=>{
      h+="<div class='card'><h3>"+esc(m.name)+"<button class='del' onclick='WepPrimes.remove(\""+m.id+"\")'>✕</button></h3>";
      if(m.accounts.length===0) h+="<p class='small' style='margin:0'>Aucune affiliation enregistrée.</p>";
      m.accounts.forEach(a=>{
        const b=bankOf(a.bank);
        const ts=accountTasks(m,a);
        const doneN=ts.filter(t=>t.done).length;
        h+="<div class='acct'><h4>🏦 "+esc(a.bank)+" — ouvert le "+fmt(a.openDate)+"<span class='hint'>"+doneN+"/"+ts.length+" ✓<button class='del' onclick='WepPrimes.removeAccount(\""+m.id+"\",\""+a.id+"\")'>✕</button></span></h4>";
        ts.forEach(t=>{
          const st=taskStatus(t);
          const dueTxt = t.recurring ? "chaque 30 j" : (st==="late"?"EN RETARD depuis le ":st==="soon"?"prévu avant le ":"pour le ")+fmt(t.due);
          h+="<label class='task'><input type='checkbox' "+(t.done?"checked":"")+" onchange='WepPrimes.task(\""+m.id+"\",\""+a.id+"\",\""+t.id+"\")'>"
            +"<span class='"+(t.done?"done":"")+"'>"+esc(t.label)+" <span class='due "+(st==="late"?"late":st==="soon"?"soon":"")+"'>"+dueTxt+"</span></span></label>";
        });
        h+="</div>";
      });
      h+="<div class='newacct'><select id='nb_"+m.id+"'><option value=''>Banque…</option>"+BANKS.map(b2=>"<option>"+b2.name+"</option>").join("")+"</select>"
        +"<input type='date' id='nd_"+m.id+"'>"
        +"<button class='btn' onclick='WepPrimes.addAccount(\""+m.id+"\")'>+ Ajouter</button></div>";
      h+="</div>";
    });
    h+="<button class='add' onclick='WepPrimes.add()'>+ Ajouter un WEPien</button>";
  }
  if(tab==="groupe"){
    h+="<div class='card'><h3>Avancement du groupe<button class='btn' onclick='WepPrimes.add()'>+ WEPien</button></h3><table><tr><th>WEPien</th><th>Affiliations</th><th>Primes reçues</th></tr>";
    state.members.forEach(m=>{
      const got = m.accounts.reduce((s,a)=>a.done.prime&&bankOf(a.bank)?s+bankOf(a.bank).f:s,0);
      h+="<tr><td><b>"+esc(m.name)+"</b></td><td>"
        +(m.accounts.map(a=>esc(a.bank)+" <span class='updated'>("+fmt(a.openDate)+")</span>").join("<br>")||"—")
        +"</td><td style='text-align:right'><b>"+(got?got+" €":"—")+"</b></td>"
        +"<td><button class='del' onclick='WepPrimes.remove(\""+m.id+"\")'>✕</button></td></tr>";
    });
    h+="</table><p class='small'>"+kycCount+" compte(s) ouvert(s) au total. Répartissez les parrains : chaque parrain est généralement plafonné entre 5 et 15 filleuls/an.</p></div>";
    h+="<div class='card'><h3>Cagnotte</h3><div class='kv'>"
      +"<div style='background:#ecfdf5'><b style='color:#059669'>"+primes+" €</b><span class='hint'>reçues</span></div>"
      +"<div style='background:#eef2ff'><b style='color:#4f46e5'>"+attendues+" €</b><span class='hint'>attendues</span></div>"
      +"<div style='background:#fffbeb'><b style='color:#d97706'>"+target+" €</b><span class='hint'>coût du week-end</span></div></div></div>";
    h+="<div class='card'><h3>Sync groupe <span><button class='sync "+(state.lastSync?"ok":"")+"' onclick='WepPrimes.pull()'>⬇ Récupérer</button> <button class='sync "+(state.lastSync?"ok":"")+"' onclick='WepPrimes.push()'>⬆ Partager</button></span></h3>"
      +"<p class='small'>"+(state.lastSync?"Dernière sync : "+new Date(state.lastSync).toLocaleString("fr-FR"):"Pas encore synchronisé. Configure l'URL dans Réglages.")+"</p></div>";
  }
  if(tab==="banques"){
    h+="<p class='hint'><span class='bold'>Dernière actualisation des offres : "+esc(OFFERS_UPDATED)+"</span> — clique sur une offre pour ses conditions détaillées. Revérifie toujours la page officielle juste avant d'ouvrir.</p>";
    BANKS.forEach(b=>{
      const open = state.selBank===b.name;
      h+="<div class='card offer "+(open?"open":"")+"' onclick='WepPrimes.select(\""+b.name+"\")'>"
        +"<h3 style='flex-wrap:wrap'>"+esc(b.name)+"<span style='white-space:nowrap'><span class='chip f'>Filleul "+b.f+" €</span> <span class='chip p'>Parrain "+b.p+" €</span> <span class='chev'>▸</span></span></h3>"
        +"<div class='updated'>Fiche vérifiée le "+esc(b.updated)+" · "+(open?"clique pour replier":"clique pour les conditions")+"</div>"
        +"<div class='detail'>"
        +"<h4 class='elig'>Éligibilité</h4>"+ul(b.eligibility)
        +"<h4 class='prime'>Pour débloquer la prime</h4>"+ul(b.prime)
        +"<h4 class='fees'>Frais à éviter</h4>"+ul(b.fees)
        +"<h4 class='close'>Avant de fermer le compte</h4>"+ul(b.close)
        +"</div></div>";
    });
    h+="<div class='card warn'><h3>Règles d'or</h3><ul>"
      +"<li>Ouvre ton compte toi-même : jamais personne ne le fait à ta place.</li>"
      +"<li>Passe bien par le lien/le code de ton parrain dès l'inscription : c'est non rattrapable.</li>"
      +"<li>Ne ferme pas le compte avant la fin de la période imposée (retrait de prime possible).</li>"
      +"<li>Parrainage gratuit entre proches uniquement : pas de revente de codes.</li>"
      +"<li>Tu restes libre de ne pas participer.</li></ul></div>";
  }
  if(tab==="reglages"){
    h+="<div class='card'>"
      +"<label>Date du prochain WEP</label><input type='date' value='"+esc(state.wepDate)+"' onchange='WepPrimes.set(\"wepDate\",this.value)'>"
      +"<label>Coût par personne (€)</label><input type='number' value='"+state.costPerHead+"' onchange='WepPrimes.set(\"costPerHead\",Number(this.value))'>"
      +"<label>Que fait-on des primes ?</label><select onchange='WepPrimes.set(\"mode\",this.value)'><option value='cagnotte' "+(state.mode==="cagnotte"?"selected":"")+">Cagnotte commune</option><option value='perso' "+(state.mode==="perso"?"selected":"")+">Chacun garde sa prime</option></select>"
      +"<label>URL de sync groupe (ressource JSON, GET + PUT)</label><input type='url' placeholder='https://…' value='"+esc(state.syncUrl)+"' onchange='WepPrimes.set(\"syncUrl\",this.value)' style='width:100%;max-width:none'>"
      +"<label>Clé API (facultative, ex. clé anon Supabase)</label><input type='password' value='"+esc(state.syncKey)+"' onchange='WepPrimes.set(\"syncKey\",this.value)' style='width:100%;max-width:none'>"
      +"<p class='small'>« Partager » envoie l'état du groupe, « Récupérer » le télécharge sur un autre téléphone. Chaque téléphone garde sa copie locale hors ligne.</p>"
      +"<button class='del' style='margin-top:.8rem' onclick='WepPrimes.reset()'>Tout réinitialiser</button>"
      +"</div>";
    h+="<div class='card'><h3>Installer l'appli</h3><p class='small' style='margin:0'><b>Android/Chrome :</b> menu ⋮ → « Ajouter à l'écran d'accueil ».<br><b>iPhone/Safari :</b> Partager → « Sur l'écran d'accueil ».</p></div>";
  }
  M.innerHTML=h;
}

/* API publique : intégrable dans la PWA WEP */
const WepPrimes = {
  mount(el){ tab="suivi"; el.insertAdjacentHTML("beforeend","<nav id='tabs'></nav><main id='main'></main>"); render(); },
  setTab(t){ tab=t; render(); },
  get(){ return state; },
  set(k,v){ state[k]=v; save(); render(); },
  addAccount(mid){
    const bank=document.getElementById("nb_"+mid).value;
    const openDate=document.getElementById("nd_"+mid).value;
    addAccount(mid,bank,openDate);
  },
  task: toggleTask, add: addMember, remove: removeMember,
  removeAccount: removeAccount, select(n){ state.selBank=state.selBank===n?"":n; save(); render(); },
  push: pushSync, pull: pullSync,
  reset(){ if(confirm("Tout réinitialiser ?")){ state=defaultState(); save(); render(); } },
};
window.WepPrimes = WepPrimes;
if (typeof module !== "undefined") module.exports = WepPrimes;

render();
</script>
</body>
</html>
